name: Windows UI .NET verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências
        run: dotnet restore WindowsIntegrityGuard.UI/WindowsIntegrityGuard.UI.sln

      - name: Compilar aplicação
        run: dotnet build WindowsIntegrityGuard.UI/WindowsIntegrityGuard.UI.sln --no-restore --configuration Release